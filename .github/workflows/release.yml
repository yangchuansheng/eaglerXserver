name: Diagnose Paper restart
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Diagnostic label
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce the live restart failure
        run: |
          docker build -t eaglerx-diagnose .
          sudo python3 -u - <<'PY'
          import json
          import subprocess
          import time
          from script import release_gate as gate

          import tempfile
          import secrets
          from pathlib import Path
          original = gate.run_command
          def with_blackhole(args, *rest, **kwargs):
              if args[:3] == ['docker', 'run', '-d']:
                  args = args[:3] + ['--add-host=ci.destroystokyo.com:127.0.0.1'] + args[3:]
              return original(args, *rest, **kwargs)
          gate.run_command = with_blackhole
          with tempfile.TemporaryDirectory() as mount:
              container = gate.LiveContainer('eaglerx-diagnose', 'eaglerx-version-probe', Path(mount), '1.8', secrets.token_urlsafe(32))
              try:
                  container.start()
                  subprocess.run(['docker', 'exec', '-d', container.name, 'python3', '-c',
                      'import socket,time; s=socket.socket(); s.bind(("127.0.0.1",443)); s.listen(); c,a=s.accept(); time.sleep(300)'], check=True)
                  token = gate.login(container)
                  gate.poll_until('local-ready', lambda: gate.try_runtime_command(container, token, 'list'), lambda value: value is not None, 120)
                  for command in ['version', 'version', 'list']:
                      started = time.monotonic()
                      status, body = gate.post_json(container.base_url, '/api/rcon', token, {'command': command}, timeout=20)
                      print('[DEBUG-version] ' + json.dumps({'probe': command, 'status': status, 'success': body.get('success'), 'elapsed_seconds': round(time.monotonic()-started, 2)}), flush=True)
              finally:
                  container.stop()
          PY
